<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Log in - bryanbirth</title><link rel="stylesheet" href="css/style.css"></head>
<body>
<div id="top"></div>
<div class="form-page">
  <h2>Log in to bryanbirth</h2>
  <div id="msg"></div>
  <form id="f">
    <label>Username</label><input type="text" id="user" required>
    <label>Password</label><input type="password" id="pass" required>
    <button type="submit">Log in</button>
  </form>
  <p style="margin-top:12px;font-size:12px;color:var(--muted)">No account? <a href="signup.html">Sign up</a></p>
</div>
<script src="js/config.js"></script><script src="js/api.js"></script><script src="js/ui.js"></script>
<script>
initTheme();if(checkBanGate())throw 0;
document.getElementById('top').innerHTML=renderTop();bindChrome();
document.getElementById('f').onsubmit=async e=>{
  e.preventDefault();
  try{setSession(await loginUser(document.getElementById('user').value.trim(),document.getElementById('pass').value));location.href='index.html';}
  catch(err){document.getElementById('msg').innerHTML='<div class="error">'+esc(err.message)+'</div>';}
};
</script>
</body></html>
