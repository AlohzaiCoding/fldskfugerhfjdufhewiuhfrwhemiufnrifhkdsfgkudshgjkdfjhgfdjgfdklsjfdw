<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign up - bryanbirth</title><link rel="stylesheet" href="css/style.css"></head>
<body>
<div id="top"></div>
<div class="form-page">
  <h2>Join bryanbirth</h2>
  <div id="msg"></div>
  <form id="f">
    <label>Username</label><input type="text" id="user" required>
    <label>Password</label><input type="password" id="pass" required>
    <label>Display name</label><input type="text" id="disp">
    <button type="submit">Sign up</button>
  </form>
  <p style="margin-top:12px;font-size:12px;color:var(--muted)">Have an account? <a href="login.html">Log in</a></p>
</div>
<script src="js/config.js"></script><script src="js/api.js"></script><script src="js/ui.js"></script>
<script>
initTheme();if(checkBanGate())throw 0;
document.getElementById('top').innerHTML=renderTop();bindChrome();
document.getElementById('f').onsubmit=async e=>{
  e.preventDefault();
  const user=document.getElementById('user').value.trim();
  const pass=document.getElementById('pass').value;
  const disp=document.getElementById('disp').value.trim()||user;
  if(pass.length<6){document.getElementById('msg').innerHTML='<div class="error">Password min 6 chars</div>';return;}
  try{setSession(await registerUser(user,pass,disp));location.href='index.html';}
  catch(err){document.getElementById('msg').innerHTML='<div class="error">'+esc(err.message)+'</div>';}
};
</script>
</body></html>
